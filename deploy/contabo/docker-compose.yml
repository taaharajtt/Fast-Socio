# Fast Socio — self-hosted compute stack (Phase 1).
#
# This is a COMPLETELY SEPARATE Compose project from the pre-existing
# `supabase` project at ~/supabase-stack/supabase/docker. It shares no files,
# no network, no volumes and no env file with it. `docker compose ls` must
# continue to show `supabase` untouched alongside `fastsocio-app`.
#
# Backend is Supabase CLOUD. Nothing here talks to the local Supabase stack,
# which stays empty and loopback-only.
name: fastsocio-app

services:
  app:
    build:
      context: ./repo
      dockerfile: deploy/contabo/Dockerfile
      args:
        # Interpolated from ./.env (mode 0600). Public values only — see the
        # Dockerfile note on why secrets are never build args.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        # Baked in at build time because they are inlined into client bundles:
        # image URLs and the canonical origin are both built in the browser.
        NEXT_PUBLIC_CONTABO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_CONTABO_PUBLIC_BASE_URL}
        NEXT_PUBLIC_IMGPROXY_URL: ${NEXT_PUBLIC_IMGPROXY_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        # Version-skew protection (perf audit Phase 1). The deploying commit
        # SHA, exported by the deploy step:
        #
        #   export GIT_SHA=$(git -C repo rev-parse --short HEAD)
        #   docker compose build app && docker compose up -d app
        #
        # It MUST change on every build or the mechanism is inert — two
        # different builds sharing an id is worse than having no id at all,
        # because clients would then believe a stale bundle is current.
        #
        # `:?` NOT `:-` — this is REQUIRED, and a build with it unset or empty
        # fails immediately with the message below rather than producing an
        # image. The earlier `${GIT_SHA:-}` default was the wrong call: it made
        # the single most important deploy-safety mechanism fail SILENTLY. A
        # forgotten `export` produced a perfectly healthy-looking image with no
        # skew protection, and the symptom would not appear until the NEXT
        # deploy stranded live clients on 404ing chunks — far away in time from
        # the mistake that caused it. Failing the build is loud, immediate, and
        # costs one retry. next.config.ts carries a second, independent guard
        # for the same reason (defence in depth: compose is not the only way
        # someone can invoke this build).
        NEXT_DEPLOYMENT_ID: ${GIT_SHA:?GIT_SHA is required — run "export GIT_SHA=$(git -C repo rev-parse --short HEAD)" before "docker compose build app". It becomes deploymentId and is what stops a deploy stranding live clients.}
    image: fastsocio-app:phase1
    container_name: fastsocio-app
    restart: unless-stopped

    # Server-only secrets arrive at RUNTIME only.
    env_file:
      - ./.env

    # NOT published to the host. The only way in is through Caddy on the
    # shared internal network — the app is unreachable from the internet
    # directly, so there is no way to bypass TLS or the proxy's rate limits.
    expose:
      - "3000"

    networks:
      - fastsocio-net

    volumes:
      # Shared build assets (perf audit 6.3). The container copies this build's
      # .next/static here on start; Caddy serves the directory directly and so
      # keeps answering for the PREVIOUS build's chunks after this container has
      # replaced it. Read-write here (the app is the only writer), read-only in
      # caddy. Named, so it survives `up -d` recreating the container — which is
      # the entire point, since that recreate is what used to destroy the assets.
      - static_assets:/srv/_next/static

    # WEB_CONCURRENCY drives cluster.js. It must be read together with the cpu
    # limit below: 3 workers against a 3.0 quota, so a fully busy worker still
    # has a core to itself and the 4th host core is left for imgproxy, nginx,
    # Caddy and the kernel.
    #
    # Memory, not CPU, is the real ceiling on this number — each worker is a
    # full Next runtime measured at ~450 MB RSS, so 3 workers plus the primary
    # fit inside 3G with headroom for a request spike.
    #
    # NOTE: `use cache` entries live in each worker's own memory, so the same
    # entry can be computed up to 3 times instead of once. That is still far
    # cheaper than the uncached path it replaced, but it is why raising this
    # number has diminishing returns.
    environment:
      WEB_CONCURRENCY: "3"

    # The self-hosted Supabase stack this used to leave room for has been
    # stopped since 2026-08-16 (all 11 containers exited), so the reservation
    # that capped this service at 2 vCPU was protecting nothing while the app
    # queued renders on a single core.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3.0"

    # Bounded logs. Without this, json-file logging grows until the disk fills
    # and takes the Supabase stack down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Image resizing, replacing Supabase Storage's /render/image/ endpoint.
  #
  # Runs here rather than in the Next.js process so resizing cannot compete with
  # request handling for the app's 2 vCPU — a feed of full-size photos would
  # otherwise make every page slow while sharp churns.
  imgproxy:
    image: darthsim/imgproxy:v3
    container_name: fastsocio-imgproxy
    restart: unless-stopped

    environment:
      # THE critical setting. imgproxy fetches whatever source URL it is given,
      # so without this allow-list it is an open image proxy: anyone could use
      # our bandwidth to fetch and resize arbitrary internet images, and could
      # reach anything our network can reach. Locked to our own bucket only.
      IMGPROXY_ALLOWED_SOURCES: ${NEXT_PUBLIC_CONTABO_PUBLIC_BASE_URL}/
      # Unsigned URLs are acceptable ONLY because of the allow-list above: the
      # worst a forged URL can do is request a different size of an image that
      # is already public.
      IMGPROXY_ALLOW_UNSAFE_URL: "1"
      # Serve WebP/AVIF to browsers that accept them — the whole point of the
      # transform is smaller bytes on mobile.
      IMGPROXY_ENABLE_WEBP_DETECTION: "1"
      IMGPROXY_ENABLE_AVIF_DETECTION: "1"
      # Bound the work a single request can cause.
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      IMGPROXY_TTL: "31536000"

    expose:
      - "8080"

    networks:
      - fastsocio-net

    # Raised from 1.0/512M. Image transforms are pure CPU and were the single
    # slowest endpoint in the access log; one core meant concurrent renders
    # serialised behind each other. libvips is memory-hungry on large sources
    # (IMGPROXY_MAX_SRC_RESOLUTION is 50 MP), so memory rises with it.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Caching reverse proxy in front of imgproxy — see imgcache.conf for why this
  # exists and why it is nginx rather than a Caddy cache module. Caddy's /img
  # route points HERE, not at imgproxy directly.
  imgcache:
    image: nginx:1-alpine
    container_name: fastsocio-imgcache
    restart: unless-stopped
    depends_on:
      - imgproxy

    volumes:
      - ./imgcache.conf:/etc/nginx/conf.d/default.conf:ro
      # Named volume, so the cache survives a container recreate. A cold cache
      # after every deploy would mean re-rendering the whole working set at the
      # exact moment the new image is also warming up.
      - imgcache_data:/var/cache/nginx/img

    expose:
      - "80"

    networks:
      - fastsocio-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

    # Proxying and disk writes only — no image work happens here.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: fastsocio-caddy
    restart: unless-stopped
    depends_on:
      - app
      - imgcache

    # The only publicly bound ports in this project. 80 is required for the
    # Let's Encrypt HTTP-01 challenge and for the automatic HTTP->HTTPS
    # redirect; both are already permitted by the existing UFW rules, so no
    # firewall change is needed.
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Losing caddy_data means
      # re-issuing certificates and burning Let's Encrypt rate limit.
      - caddy_data:/data
      - caddy_config:/config
      # Build assets written by the app container (perf audit 6.3). READ-ONLY:
      # Caddy serves these and must never be able to modify them. The Caddyfile
      # sets `root * /srv`, so the mount path here is what makes a request for
      # /_next/static/chunks/x.js resolve to /srv/_next/static/chunks/x.js.
      - static_assets:/srv/_next/static:ro

    networks:
      - fastsocio-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Dedicated bridge. Explicitly NOT joined to the supabase project's network.
  fastsocio-net:
    name: fastsocio-net
    driver: bridge

volumes:
  caddy_data:
    name: fastsocio-caddy-data
  caddy_config:
    name: fastsocio-caddy-config
  imgcache_data:
    name: fastsocio-imgcache-data
  # Written by app, read by caddy. Holds several builds' worth of client chunks
  # so a deploy cannot strand a client mid-session (perf audit 6.3).
  static_assets:
    name: fastsocio-static-assets

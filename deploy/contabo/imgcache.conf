# Caching layer in front of imgproxy.
#
# imgproxy has no result cache of its own (that is a Pro feature), so before
# this every cache-cold viewer paid the FULL cost again: fetch the original from
# Contabo, decode, resize, re-encode. Measured on production over 3 hours, 809
# image requests burned ~2060s of CPU on a container limited to one core, with
# p50 3.7s and a 30s worst case on the widest renders. The bytes are immutable
# once written — object keys are timestamped on upload and never rewritten — so
# recomputing them per viewer was pure waste.
#
# nginx rather than a Caddy cache module: Caddy has no cache handler in the
# stock image, so caching there would mean an xcaddy build, and the thing being
# rebuilt would be the process that terminates TLS for production. This keeps
# the blast radius on images — if this container fails, Caddy's /img route
# fails and the app itself is untouched.

# 4g on a 96G disk that is 60% used. inactive=30d, not the 1y IMGPROXY_TTL:
# eviction here is a disk-space policy, not a correctness one.
proxy_cache_path /var/cache/nginx/img
                 levels=1:2
                 keys_zone=img:20m
                 max_size=4g
                 inactive=30d
                 use_temp_path=off;

# imgproxy content-negotiates on Accept (IMGPROXY_ENABLE_WEBP_DETECTION /
# _AVIF_DETECTION), so the SAME URL legitimately yields different bytes per
# browser. Caching without accounting for that would serve an AVIF to a browser
# that cannot decode it — a broken image, not a slow one.
#
# The negotiated format is folded into the cache key as one short token instead
# of the raw Accept header: raw Accept strings differ per browser build and
# would shatter the cache into near-duplicate entries for identical output.
# Order matters — AVIF is checked first because imgproxy prefers it when both
# are offered.
map $http_accept $img_fmt {
    default        orig;
    "~*image/webp" webp;
    "~*image/avif" avif;
}

# Access log with the cache verdict in it (perf audit Phase 6).
#
# `add_header X-Img-Cache` below already exposes HIT/MISS/STALE on each
# RESPONSE, which is what you want when checking one URL with curl. It is not
# enough to answer "is the cache working", because that is an aggregate over
# real traffic and the header is not recorded anywhere. Without this the hit
# rate could only be inferred, and the audit that led here had to leave the
# number blank.
#
# Note when measuring by hand that the cache key includes the negotiated format
# ($img_fmt, from Accept), so `curl -H "Accept: image/webp"` addresses a
# DIFFERENT entry than a browser sending image/avif — a MISS from curl does not
# mean the browser missed too. Reading the log avoids that trap entirely.
#
#   docker logs fastsocio-imgcache --since 24h #     | grep -oE 'cache=[A-Z-]+' | sort | uniq -c | sort -rn
log_format imgcache '$remote_addr $status $body_bytes_sent '
                    'cache=$upstream_cache_status fmt=$img_fmt '
                    'rt=$request_time "$request_uri"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout imgcache;

    # Transformed images are large; buffering them to disk to feed a slow mobile
    # client is the right trade, but the default 8k in-memory buffers cause
    # excessive temp-file churn on every response.
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;

    location / {
        # Docker's embedded DNS, with the upstream held in a VARIABLE on
        # purpose. With a literal hostname nginx resolves it once at startup and
        # exits hard if it does not resolve yet ("host not found in upstream"),
        # so any restart that brings this container up before imgproxy would
        # crash-loop it. Via a variable the name is resolved per request instead.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $imgproxy_upstream http://imgproxy:8080;

        # $request_uri, not a bare proxy_pass: these URLs carry a percent-encoded
        # source URL (plain/https%3A%2F%2F...). A bare proxy_pass hands nginx's
        # NORMALISED uri to the upstream, which decodes those escapes and would
        # change the path imgproxy actually receives. $request_uri forwards the
        # client's bytes verbatim.
        proxy_pass $imgproxy_upstream$request_uri;
        proxy_set_header Host $host;

        proxy_cache img;
        proxy_cache_key "$request_uri|$img_fmt";

        proxy_cache_valid 200 30d;
        # Negative results are cached only briefly: a 404 here usually means the
        # object has not finished uploading yet, and pinning that for 30 days
        # would make a newly posted image permanently broken.
        proxy_cache_valid 404 403 1m;

        # Collapse concurrent misses for the same key into ONE upstream render.
        # This is the setting that matters when a post hits the feed and dozens
        # of clients request the identical transform at once.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;

        # Serve stale rather than a broken image while imgproxy is down, slow,
        # or busy regenerating.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;

        # imgproxy can take a while on a cold, large original; keep this above
        # IMGPROXY_DOWNLOAD_TIMEOUT (10s) so we surface its error, not ours.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # HIT/MISS/STALE, so cache effectiveness is measurable from curl rather
        # than inferred. Safe to expose: it describes our own cache state and
        # every object behind this path is public.
        add_header X-Img-Cache $upstream_cache_status always;
    }

    # Lets the healthcheck verify nginx itself without rendering an image.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
